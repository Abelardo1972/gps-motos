<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente - Seguimiento de Estado</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }

    #card-status {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 420px; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px); padding: 16px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000;
    }

    .badge-status {
      display: inline-block; padding: 6px 12px; border-radius: 20px;
      font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; text-transform: uppercase;
    }
    .st-espera { background: #fff3cd; color: #856404; }
    .st-aceptado { background: #d4edda; color: #155724; }
    .st-recogido { background: #cce5ff; color: #004085; }
    .st-entregado { background: #d1ecf1; color: #0c5460; }

    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="card-status">
    <div id="badge" class="badge-status st-espera">Esperando Repartidor</div>
    <h3 id="main-title">Tu pedido ha sido creado</h3>
    <p id="sub-title" style="font-size: 0.85rem; color: #666; margin-top: 4px;">En cuanto un motorizado acepte el pedido, podrás seguir su trayectoria.</p>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const URL_SERVIDOR = "https://render-tw5p.onrender.com";
    const socket = io(URL_SERVIDOR);

    let map = L.map('map').setView([-17.7833, -63.1821], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198348.png',
      iconSize: [42, 42], iconAnchor: [21, 21]
    });

    let motoMarker = null;

    // --- ESCUCHAR CAMBIOS DE ESTADO DESDE EL REPARTIDOR ---
    socket.on('estado_actualizado', (data) => {
      const badge = document.getElementById('badge');
      const title = document.getElementById('main-title');
      const sub = document.getElementById('sub-title');

      if (data.estado === 'ACEPTADO') {
        badge.className = "badge-status st-aceptado";
        badge.innerText = "Pedido Aceptado";
        title.innerText = "El motorizado va en camino a la recogida";
        sub.innerText = "Sigue su posición sobre el mapa en vivo.";
      } else if (data.estado === 'RECOGIDO') {
        badge.className = "badge-status st-recogido";
        badge.innerText = "Paquete Recogido";
        title.innerText = "El motorizado lleva tu paquete al destino";
        sub.innerText = "En camino al punto de entrega.";
      } else if (data.estado === 'ENTREGADO') {
        badge.className = "badge-status st-entregado";
        badge.innerText = "¡Pedido Entregado!";
        title.innerText = "El paquete ha llegado a su destino";
        sub.innerText = "Gracias por utilizar nuestro servicio.";
      }
    });

    // --- POSICIÓN EN TIEMPO REAL ---
    socket.on('actualizar_posicion_cliente', (data) => {
      const latLng = [data.lat, data.lng];

      if (!motoMarker) {
        motoMarker = L.marker(latLng, { icon: motoIcon }).addTo(map);
        map.setView(latLng, 17);
      } else {
        motoMarker.setLatLng(latLng);
        map.panTo(latLng);
      }
    });
  </script>
</body>
</html>
