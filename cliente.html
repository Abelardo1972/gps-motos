<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente - Tracking de Envíos en Tiempo Real</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f6f8;
    }

    /* Card Flotante Superior */
    #status-card {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icon {
      font-size: 2rem;
    }

    .status-info h3 {
      font-size: 1rem;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .status-info p {
      font-size: 0.85rem;
      color: #666;
    }

    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      background: #e3f2fd;
      color: #1976d2;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Card de Estado sobre el Mapa -->
  <div id="status-card">
    <div class="status-icon">🛵</div>
    <div class="status-info">
      <h3>Tu repartidor está en camino</h3>
      <p id="details">Buscando señal del GPS...</p>
      <span id="speed-badge" class="badge">Velocidad: 0 km/h</span>
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // REEMPLAZA ESTA URL CON TU ENLACE DE RENDER
    // -------------------------------------------------------------
    const URL_SERVIDOR = "https://render-tw5p.onrender.com";

    // 1. Inicializar Mapa
    const map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Icono personalizado para la Moto en el Mapa del Cliente
    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198348.png',
      iconSize: [42, 42],
      iconAnchor: [21, 21],
      popupAnchor: [0, -20]
    });

    let motoMarker = null;

    // 2. Conectar al Servidor WebSocket
    const socket = io(URL_SERVIDOR);

    socket.on("connect", () => {
      console.log("🟢 Cliente conectado al servidor de tracking:", socket.id);
      document.getElementById('details').innerText = "Conectado. Esperando que el repartidor inicie el viaje.";
    });

    socket.on("disconnect", () => {
      console.log("🔴 Desconectado del servidor");
      document.getElementById('details').innerText = "Conexión perdida con el servidor.";
    });

    // 3. RECIBIR LA POSICIÓN EN TIEMPO REAL TRANSMITIDA DESDE EL REPARTIDOR
    socket.on('actualizar_posicion_cliente', (data) => {
      /*
        Recibe 'data': { lat, lng, speed, accuracy, motoId }
      */
      const latLng = [data.lat, data.lng];

      // Actualizar información en pantalla
      document.getElementById('details').innerText = `Ubicación actualizada en vivo (Precisión: ±${Math.round(data.accuracy)}m)`;
      document.getElementById('speed-badge').innerText = `Velocidad: ${data.speed} km/h`;

      // Crear o mover el marcador sobre el mapa
      if (!motoMarker) {
        motoMarker = L.marker(latLng, { icon: motoIcon }).addTo(map)
          .bindPopup(`<b>Repartidor (${data.motoId})</b><br>En camino con tu pedido`).openPopup();
        
        // Centrar mapa con zoom adecuado
        map.setView(latLng, 17);
      } else {
        // Mover marcador de la moto suavemente a las nuevas coordenadas
        motoMarker.setLatLng(latLng);
        map.panTo(latLng);
      }
    });
  </script>
</body>
</html>
