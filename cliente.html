<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DriveApp - Cliente</title>
  
  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* Mapa en pantalla completa */
    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Header flotante minimalista */
    .app-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .icon-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    /* Bottom Sheet - Tarjeta deslizable */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px 28px 0 0;
      padding: 20px 24px 32px 24px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }

    .drag-handle {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    /* Inputs de Ubicación */
    .input-group {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-group input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .dot-origin { width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; flex-shrink: 0; }
    .dot-destination { width: 10px; height: 10px; background: #ef4444; border-radius: 2px; flex-shrink: 0; }

    /* Info de Tarifa */
    .fare-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      padding: 16px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15));
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
    }

    .fare-price {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
    }

    /* Botón Principal Acción */
    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Modificación estética de los popups del mapa */
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
  </style>
</head>
<body>

  <!-- Header Flotante -->
  <div class="app-header">
    <button class="icon-btn"><i data-lucide="menu"></i></button>
    <button class="icon-btn" id="btnGPS"><i data-lucide="crosshair"></i></button>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Panel Inferior Estilo App Mobile -->
  <div class="bottom-sheet">
    <div class="drag-handle"></div>
    
    <div class="input-group">
      <div class="dot-origin"></div>
      <input type="text" id="origenText" placeholder="Origen (Haz clic en el mapa)" readonly>
    </div>

    <div class="input-group">
      <div class="dot-destination"></div>
      <input type="text" id="destinoText" placeholder="Destino (Haz clic en el mapa)" readonly>
    </div>

    <div class="fare-container">
      <div>
        <span style="font-size: 12px; color: #94a3b8;">Tarifa Estimada</span>
        <div class="fare-price" id="precioText">$0.00</div>
      </div>
      <span style="font-size: 13px; color: #94a3b8;" id="distanciaText">0.0 km</span>
    </div>

    <button class="btn-primary" id="btnSolicitar" disabled>
      <span>Solicitar Carrera</span>
      <i data-lucide="arrow-right"></i>
    </button>
  </div>

  <!-- Librerías de Leaflet y Socket.io -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    // Inicializar Iconos Vectoriales
    lucide.createIcons();

    // 1. Conexión al Servidor Socket.io en Render
    const socket = io('https://render-tw5p.onrender.com');

    // 2. Variables Globales
    let map, originMarker, destMarker, routeLayer, motoMarker;
    let coordsOrigen = null;
    let coordsDestino = null;
    let precioCalculado = "$0.00";
    let distanciaCalculada = "0.0 km";

    // 3. Inicializar Mapa (Vista en Santa Cruz)
    map = L.map('map', { zoomControl: false }).setView([-17.7833, -63.1821], 14);

  
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

    // Iconos personalizados
    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198336.png',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    // 4. Lógica de selección de Origen y Destino al hacer clic en el mapa
    map.on('click', (e) => {
      const { lat, lng } = e.latlng;

      if (!coordsOrigen) {
        coordsOrigen = [lat, lng];
        if (originMarker) map.removeLayer(originMarker);
        originMarker = L.marker(coordsOrigen).addTo(map).bindPopup("Origen").openPopup();
        document.getElementById('origenText').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      } else if (!coordsDestino) {
        coordsDestino = [lat, lng];
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker(coordsDestino).addTo(map).bindPopup("Destino").openPopup();
        document.getElementById('destinoText').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        
        // Calcular la ruta con OSRM al tener ambos puntos
        calcularRutaOSRM();
      } else {
        // Reiniciar puntos al tercer clic
        reiniciarPuntos();
        coordsOrigen = [lat, lng];
        originMarker = L.marker(coordsOrigen).addTo(map).bindPopup("Origen").openPopup();
        document.getElementById('origenText').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
    });

    // 5. Calcular Ruta y Tarifa con API OSRM
    async function calcularRutaOSRM() {
      const url = `https://router.project-osrm.org/route/v1/driving/${coordsOrigen[1]},${coordsOrigen[0]};${coordsDestino[1]},${coordsDestino[0]}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const distKm = (route.distance / 1000).toFixed(1);
          
          // Cálculo de tarifa base ($5 base + $2.5 por km)
          const tarifa = (5 + (distKm * 2.5)).toFixed(2);

          distanciaCalculada = `${distKm} km`;
          precioCalculado = `$${tarifa}`;

          document.getElementById('distanciaText').innerText = distanciaCalculada;
          document.getElementById('precioText').innerText = precioCalculado;

          // Dibujar la línea de ruta en el mapa
          if (routeLayer) map.removeLayer(routeLayer);
          routeLayer = L.geoJSON(route.geometry, {
            style: { color: '#3b82f6', weight: 5, opacity: 0.8 }
          }).addTo(map);

          map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

          // Habilitar botón de solicitud
          document.getElementById('btnSolicitar').disabled = false;
        }
      } catch (err) {
        console.error("Error al calcular la ruta:", err);
      }
    }

    // 6. Resetear marcadores
    function reiniciarPuntos() {
      if (originMarker) map.removeLayer(originMarker);
      if (destMarker) map.removeLayer(destMarker);
      if (routeLayer) map.removeLayer(routeLayer);
      coordsOrigen = null;
      coordsDestino = null;
      document.getElementById('origenText').value = '';
      document.getElementById('destinoText').value = '';
      document.getElementById('precioText').innerText = '$0.00';
      document.getElementById('distanciaText').innerText = '0.0 km';
      document.getElementById('btnSolicitar').disabled = true;
    }

    // 7. Solicitar el Pedido al Servidor Socket.io
    document.getElementById('btnSolicitar').addEventListener('click', () => {
      if (!coordsOrigen || !coordsDestino) return;

      const pedidoData = {
        clienteId: socket.id,
        origenText: document.getElementById('origenText').value,
        destinoText: document.getElementById('destinoText').value,
        precio: precioCalculado,
        distancia: distanciaCalculada,
        coordsOrigen: coordsOrigen,
        coordsDestino: coordsDestino
      };

      // Emitir el evento al backend
      socket.emit('solicitar_pedido', pedidoData);
      
      const btn = document.getElementById('btnSolicitar');
      btn.disabled = true;
      btn.querySelector('span').innerText = "Buscando repartidor...";
    });

    // 8. Escuchar la Posición en Tiempo Real del Repartidor
    socket.on('actualizar_posicion_cliente', (data) => {
      const { lat, lng } = data;
      if (!motoMarker) {
        motoMarker = L.marker([lat, lng], { icon: motoIcon }).addTo(map);
      } else {
        motoMarker.setLatLng([lat, lng]);
      }
    });

    // 9. Escuchar Cambios de Estado del Pedido
    socket.on('estado_actualizado', (data) => {
      const btn = document.getElementById('btnSolicitar');
      if (data.estado === 'ACEPTADO') {
        btn.querySelector('span').innerText = "¡Repartidor en camino!";
      } else if (data.estado === 'RECOGIDO') {
        btn.querySelector('span').innerText = "Pedido en curso...";
      } else if (data.estado === 'ENTREGADO') {
        btn.querySelector('span').innerText = "¡Pedido entregado!";
        setTimeout(() => {
          reiniciarPuntos();
          btn.querySelector('span').innerText = "Solicitar Carrera";
        }, 3000);
      }
    });

    // Botón GPS para centrar en ubicación actual
    document.getElementById('btnGPS').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        });
      }
    });
  </script>
</body>
</html>
