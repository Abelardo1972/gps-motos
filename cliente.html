<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente - Cotizador y Tracking en Tiempo Real</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }

    /* Panel Flotante de Cotización y Tracking */
    #calculator-card {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .instructions { font-size: 0.85rem; color: #555; margin-bottom: 10px; }

    .price-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .price-value { font-size: 1.4rem; font-weight: bold; color: #00ff88; }
    .btn-reset { background: #ff4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    .tracking-status {
      margin-top: 10px;
      padding: 8px;
      background: #e3f2fd;
      color: #1976d2;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <!-- Panel de Cotización -->
  <div id="calculator-card">
    <div id="step-text" class="instructions">📌 Haz clic en el mapa para fijar el <b>Origen (Punto A)</b>.</div>
    
    <div class="price-container">
      <div>
        <div style="font-size: 0.75rem; color: #aaa;">TARIFA ESTIMADA</div>
        <div id="price" class="price-value">$0.00</div>
      </div>
      <div>
        <div id="distance-info" style="font-size: 0.8rem; text-align: right; color: #ccc;">0 km / 0 min</div>
        <button class="btn-reset" onclick="reiniciarPuntos()">Reiniciar Puntos</button>
      </div>
    </div>

    <!-- Estado del servidor de Render y GPS -->
    <div id="status-moto" class="tracking-status">Conectando con el servidor de Render...</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // 1. CONEXIÓN A TU SERVIDOR EN RENDER
    // -------------------------------------------------------------
    const URL_SERVIDOR = "https://render-tw5p.onrender.com";
    const socket = io(URL_SERVIDOR);

    socket.on("connect", () => {
      console.log("🟢 Conectado a Render:", socket.id);
      document.getElementById("status-moto").innerText = "Servidor conectado. Esperando repartidor...";
    });

    socket.on("disconnect", () => {
      document.getElementById("status-moto").innerText = "Desconectado del servidor.";
    });

    // Configuración de Tarifas para Moto
    const TARIFA_BASE = 1.50;  // Precio inicial fijo
    const PRECIO_KM = 0.50;    // Precio por kilómetro recorrido
    const PRECIO_MIN = 0.10;   // Precio por minuto estimado

    // Inicializar Mapa centrado en la ciudad
    let map = L.map('map').setView([-17.7833, -63.1821], 14); 

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Icono personalizado para la moto
    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198348.png',
      iconSize: [42, 42],
      iconAnchor: [21, 21]
    });

    let puntoA = null;
    let puntoB = null;
    let markerA = null;
    let markerB = null;
    let motoMarker = null;
    let routePolyline = null;

    // Escuchar clics en el mapa para marcar Ruta
    map.on('click', function(e) {
      if (!puntoA) {
        puntoA = e.latlng;
        markerA = L.marker(puntoA).addTo(map).bindPopup("<b>Origen (Recogida)</b>").openPopup();
        document.getElementById('step-text').innerHTML = "🏁 Ahora haz clic para fijar el <b>Destino (Punto B)</b>.";
      } else if (!puntoB) {
        puntoB = e.latlng;
        markerB = L.marker(puntoB).addTo(map).bindPopup("<b>Destino (Entrega)</b>").openPopup();
        document.getElementById('step-text').innerHTML = "✅ Ruta calculada.";
        
        calcularRutaYTarifa();
      }
    });

    async function calcularRutaYTarifa() {
      if (!puntoA || !puntoB) return;

      const url = `https://router.project-osrm.org/route/v1/driving/${puntoA.lng},${puntoA.lat};${puntoB.lng},${puntoB.lat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const distanciaKm = (route.distance / 1000).toFixed(2);
          const tiempoMin = Math.round(route.duration / 60);

          if (routePolyline) map.removeLayer(routePolyline);
          const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
          routePolyline = L.polyline(coordinates, { color: '#007bff', weight: 5, opacity: 0.8 }).addTo(map);
          map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

          const costoTotal = TARIFA_BASE + (distanciaKm * PRECIO_KM) + (tiempoMin * PRECIO_MIN);

          document.getElementById('price').innerText = `$${costoTotal.toFixed(2)}`;
          document.getElementById('distance-info').innerText = `${distanciaKm} km / ~${tiempoMin} min`;
        }
      } catch (error) {
        console.error("Error al calcular la ruta:", error);
      }
    }

    function reiniciarPuntos() {
      if (markerA) map.removeLayer(markerA);
      if (markerB) map.removeLayer(markerB);
      if (routePolyline) map.removeLayer(routePolyline);
      puntoA = null;
      puntoB = null;
      document.getElementById('price').innerText = "$0.00";
      document.getElementById('distance-info').innerText = "0 km / 0 min";
      document.getElementById('step-text').innerHTML = "📌 Haz clic en el mapa para fijar el <b>Origen (Punto A)</b>.";
    }

    // -------------------------------------------------------------
    // 2. RECIBIR LA MOTO EN TIEMPO REAL DESDE EL SERVIDOR (RENDER)
    // -------------------------------------------------------------
    socket.on('actualizar_posicion_cliente', (data) => {
      const latLng = [data.lat, data.lng];

      document.getElementById("status-moto").innerText = `🛵 Moto en camino: ${data.speed} km/h (Precisión: ±${Math.round(data.accuracy)}m)`;

      if (!motoMarker) {
        motoMarker = L.marker(latLng, { icon: motoIcon }).addTo(map)
          .bindPopup(`<b>Repartidor en vivo</b>`).openPopup();
      } else {
        motoMarker.setLatLng(latLng);
      }
    });
  </script>
</body>
</html>
