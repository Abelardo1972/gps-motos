<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repartidor - Alertas de Pedidos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }

    #top-bar {
      background: #1e1e1e; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
    }
    .stat-title { font-size: 0.7rem; color: #888; text-transform: uppercase; }
    .stat-val { font-size: 0.95rem; font-weight: bold; color: #00ff88; }

    #map { flex: 1; width: 100%; }

    /* TARJETA POPUP / ALERTA DE NUEVO PEDIDO */
    #order-alert-card {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 380px; background: #1e1e1e; border: 2px solid #00ff88;
      border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 2000; display: none; animation: popUp 0.3s ease-out;
    }

    @keyframes popUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .alert-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .alert-price { font-size: 1.6rem; font-weight: bold; color: #00ff88; }
    .alert-dist { font-size: 0.85rem; color: #aaa; }

    .btn-group { display: flex; gap: 10px; margin-top: 14px; }
    .btn-action {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 0.95rem; cursor: pointer;
    }
    .btn-accept { background: #00ff88; color: #000; }
    .btn-reject { background: #333; color: #ff4444; border: 1px solid #ff4444; }

    /* BOTONES DE ESTADO POST-ACEPTACIÓN */
    #status-controls {
      background: #1e1e1e; padding: 14px; border-top: 1px solid #333; display: none;
    }
    .btn-status {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    .btn-pickup { background: #ffc107; color: #000; }
    .btn-deliver { background: #17a2b8; color: #fff; display: none; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div><div class="stat-title">Estado GPS</div><div id="status-gps" class="stat-val">En línea</div></div>
    <div><div class="stat-title">Velocidad</div><div id="speed" class="stat-val">0 km/h</div></div>
  </div>

  <div id="map"></div>

  <!-- TARJETA FLOTANTE DE ALERTA -->
  <div id="order-alert-card">
    <div class="alert-header">
      <span style="font-size: 0.8rem; background: #333; padding: 4px 8px; border-radius: 4px; color: #00ff88;">⚡ ¡NUEVO PEDIDO!</span>
      <span id="alert-dist" class="alert-dist">3.2 km</span>
    </div>
    <div id="alert-price" class="alert-price">$0.00</div>
    <div style="font-size: 0.8rem; color: #ccc; margin-top: 6px;">📍 Cliente esperando confirmación</div>

    <div class="btn-group">
      <button class="btn-action btn-reject" onclick="rechazarPedido()">Rechazar</button>
      <button class="btn-action btn-accept" onclick="aceptarPedido()">Aceptar Carrera</button>
    </div>
  </div>

  <!-- PANEL DE ESTADOS UNA VEZ ACEPTADO -->
  <div id="status-controls">
    <button id="btn-pickup" class="btn-status btn-pickup" onclick="marcarRecogido()">2. Confirmar Paquete Recogido</button>
    <button id="btn-deliver" class="btn-status btn-deliver" onclick="confirmarEntrega()">3. Confirmar Entrega Final</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const URL_SERVIDOR = "https://render-tw5p.onrender.com";
    const socket = io(URL_SERVIDOR);

    let map = L.map('map').setView([-17.7833, -63.1821], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198348.png',
      iconSize: [38, 38], iconAnchor: [19, 19]
    });

    let motoMarker = null, watchId = null;

    // Conectar GPS en segundo plano al entrar
    if ("geolocation" in navigator) {
      watchId = navigator.geolocation.watchPosition(onGPSSuccess, null, { enableHighAccuracy: true });
    }

    function onGPSSuccess(pos) {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : 0;
      
      document.getElementById("speed").innerText = `${speed} km/h`;

      if (!motoMarker) {
        motoMarker = L.marker([lat, lng], { icon: motoIcon }).addTo(map);
        map.setView([lat, lng], 15);
      } else {
        motoMarker.setLatLng([lat, lng]);
      }

      if (socket.connected) {
        socket.emit('ubicacion_moto', { motoId: "MOTO-01", lat, lng, speed, accuracy: pos.coords.accuracy });
      }
    }

    // --- ESCUCHAR ALERTA DE NUEVO PEDIDO ---
    socket.on('nuevo_pedido_disponible', (data) => {
      document.getElementById('alert-price').innerText = data.precio;
      document.getElementById('alert-dist').innerText = data.distancia;
      document.getElementById('order-alert-card').style.display = 'block';
    });

    function rechazarPedido() {
      document.getElementById('order-alert-card').style.display = 'none';
    }

    function aceptarPedido() {
      document.getElementById('order-alert-card').style.display = 'none';
      document.getElementById('status-controls').style.display = 'block';

      // Notificar al servidor que se aceptó la carrera
      socket.emit('cambiar_estado', { estado: 'ACEPTADO', motoId: 'MOTO-01' });
    }

    function marcarRecogido() {
      socket.emit('cambiar_estado', { estado: 'RECOGIDO', motoId: 'MOTO-01' });
      document.getElementById('btn-pickup').style.display = 'none';
      document.getElementById('btn-deliver').style.display = 'block';
    }

    function confirmarEntrega() {
      socket.emit('cambiar_estado', { estado: 'ENTREGADO', motoId: 'MOTO-01' });
      document.getElementById('status-controls').style.display = 'none';
      document.getElementById('btn-pickup').style.display = 'block';
      document.getElementById('btn-deliver').style.display = 'none';
    }
  </script>
</body>
</html>
