<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repartidor - Panel de Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }

    #top-bar {
      background: #1e1e1e; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
    }
    .stat { text-align: center; }
    .stat-title { font-size: 0.7rem; color: #888; text-transform: uppercase; }
    .stat-val { font-size: 0.95rem; font-weight: bold; color: #00ff88; }

    #map { flex: 1; width: 100%; }

    /* Panel Flotante de Acciones */
    #action-panel {
      background: #1e1e1e; padding: 16px; border-top: 1px solid #333;
      display: flex; flex-direction: column; gap: 10px;
    }

    .btn-action {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center;
      transition: background 0.2s;
    }

    .btn-accept { background: #28a745; color: #fff; }
    .btn-pickup { background: #ffc107; color: #000; display: none; }
    .btn-deliver { background: #17a2b8; color: #fff; display: none; }
    .btn-finish { background: #dc3545; color: #fff; display: none; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="stat"><div class="stat-title">Estado GPS</div><div id="status-gps" class="stat-val" style="color:#ffaa00;">Inactivo</div></div>
    <div class="stat"><div class="stat-title">Precisión</div><div id="accuracy" class="stat-val">-- m</div></div>
    <div class="stat"><div class="stat-title">Velocidad</div><div id="speed" class="stat-val">0 km/h</div></div>
  </div>

  <div id="map"></div>

  <!-- Botones de Control de Estado -->
  <div id="action-panel">
    <button id="btn-accept" class="btn-action btn-accept" onclick="aceptarPedido()">1. Aceptar Pedido</button>
    <button id="btn-pickup" class="btn-action btn-pickup" onclick="marcarRecogido()">2. Confirmar Paquete Recogido</button>
    <button id="btn-deliver" class="btn-action btn-deliver" onclick="confirmarEntrega()">3. Confirmar Entrega Final</button>
    <button id="btn-finish" class="btn-action btn-finish" onclick="reiniciarCarrera()">Finalizar y Volver a Iniciar</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const URL_SERVIDOR = "https://render-tw5p.onrender.com";
    const socket = io(URL_SERVIDOR, { autoConnect: false });

    let map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const motoIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3198/3198348.png',
      iconSize: [38, 38], iconAnchor: [19, 19]
    });

    let motoMarker = null;
    let watchId = null;

    // --- LÓGICA DE ESTADOS Y BOTONES ---

    function aceptarPedido() {
      socket.connect();
      startGPS();
      
      // Notificar al servidor
      socket.emit('cambiar_estado', { estado: 'ACEPTADO', motoId: 'MOTO-01' });

      // Cambiar botones visuales
      document.getElementById('btn-accept').style.display = 'none';
      document.getElementById('btn-pickup').style.display = 'block';
    }

    function marcarRecogido() {
      socket.emit('cambiar_estado', { estado: 'RECOGIDO', motoId: 'MOTO-01' });

      document.getElementById('btn-pickup').style.display = 'none';
      document.getElementById('btn-deliver').style.display = 'block';
    }

    function confirmarEntrega() {
      socket.emit('cambiar_estado', { estado: 'ENTREGADO', motoId: 'MOTO-01' });
      stopGPS();

      document.getElementById('btn-deliver').style.display = 'none';
      document.getElementById('btn-finish').style.display = 'block';
    }

    function reiniciarCarrera() {
      document.getElementById('btn-finish').style.display = 'none';
      document.getElementById('btn-accept').style.display = 'block';
      document.getElementById('status-gps').innerText = "Inactivo";
      document.getElementById('status-gps').style.color = "#ffaa00";
    }

    // --- LÓGICA GPS ---

    function startGPS() {
      if (!("geolocation" in navigator)) return alert("GPS no disponible.");
      
      const options = { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 };
      watchId = navigator.geolocation.watchPosition(onGPSSuccess, null, options);
    }

    function stopGPS() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    }

    function onGPSSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0;
      const latLng = [lat, lng];

      document.getElementById("status-gps").innerText = "Transmitiendo";
      document.getElementById("status-gps").style.color = "#00ff88";
      document.getElementById("accuracy").innerText = `±${Math.round(accuracy)}m`;
      document.getElementById("speed").innerText = `${speed} km/h`;

      if (!motoMarker) {
        motoMarker = L.marker(latLng, { icon: motoIcon }).addTo(map);
        map.setView(latLng, 17);
      } else {
        motoMarker.setLatLng(latLng);
        map.panTo(latLng);
      }

      if (socket.connected) {
        socket.emit('ubicacion_moto', { motoId: "MOTO-01", lat, lng, speed, accuracy });
      }
    }
  </script>
</body>
</html>
